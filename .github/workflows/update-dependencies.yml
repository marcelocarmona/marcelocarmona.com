name: Update dependencies

on:
  schedule:
    # Run daily at 09:00 UTC (01:00 PST / 02:00 PDT).
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Update direct dependencies
        shell: bash
        run: |
          mapfile -t dependencies < <(
            node -e '
              const manifest = require("./package.json")
              const dependencies = [
                ...Object.keys(manifest.dependencies ?? {}),
                ...Object.keys(manifest.devDependencies ?? {}),
              ]
              process.stdout.write(dependencies.join("\n"))
            '
          )

          if (( ${#dependencies[@]} > 0 )); then
            npm update --save -- "${dependencies[@]}"
          fi

      - name: Detect dependency changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.changes.outputs.updated == 'true'
        run: npm run lint:check

      - name: Test
        if: steps.changes.outputs.updated == 'true'
        run: npm test

      - name: Build
        if: steps.changes.outputs.updated == 'true'
        run: npm run build

      - name: Commit and push
        if: steps.changes.outputs.updated == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): update direct dependencies"
          git push origin HEAD:main
